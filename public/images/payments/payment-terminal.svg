    <text x="40" y="86" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Primary Bank Gateway: 504 Timeout</text>
    <path d="M 40 106 L 100 106 L 120 130 L 220 130" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="220" cy="130" r="4" fill="#10b981" />
