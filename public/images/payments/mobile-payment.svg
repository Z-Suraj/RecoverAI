<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#payBg)" />
  <circle cx="400" cy="300" r="160" fill="#6366f1" opacity="0.15" />

  <!-- Smartphone Frame with UPI Payment Modal -->
  <g transform="translate(280, 80)">
    <!-- Device Body -->
    <rect width="240" height="440" rx="32" fill="url(#phoneGrad)" stroke="#475569" stroke-width="3" />
    <!-- Dynamic Island / Speaker -->
    <rect x="80" y="14" width="80" height="14" rx="7" fill="#020617" />
    
    <!-- Screen App -->
    <g transform="translate(16, 46)">
      <!-- App Header -->
      <rect width="208" height="360" rx="18" fill="#0f172a" />
      
      <!-- UPI Flow -->
      <circle cx="104" cy="50" r="24" fill="#10b981" opacity="0.2" />
      <path d="M 94 50 L 101 57 L 115 43" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <text x="104" y="94" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Payment Recovered</text>
      <text x="104" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">RecoverAI Instant UPI Intent</text>
      
      <rect x="16" y="130" width="176" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="28" y="152" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-transform="uppercase" font-weight="700">Amount Paid</text>
      <text x="28" y="178" fill="#10b981" font-family="monospace" font-size="18" font-weight="900">₹8,499.00</text>

      <rect x="16" y="210" width="176" height="48" rx="8" fill="#1e293b" />
      <text x="28" y="230" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Merchant: NovaCart HQ</text>
      <text x="28" y="246" fill="#64748b" font-family="monospace" font-size="9">TXN_RECOV_9024</text>

      <rect x="16" y="280" width="176" height="44" rx="10" fill="#10b981" />
      <text x="104" y="307" fill="#022c22" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Done &amp; Confirmed ✓</text>
    </g>
