<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#commBg)" />
  <circle cx="400" cy="300" r="180" fill="#4338ca" opacity="0.2" />
  
  <!-- Shopping Cart & Dropped Transaction Visual -->
  <g transform="translate(250, 150)">
    <!-- Browser Window Frame -->
    <rect width="300" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 0 16 Q 0 0 16 0 L 284 0 Q 300 0 300 16 L 300 36 L 0 36 Z" fill="#0f172a" />
    <circle cx="20" cy="18" r="4" fill="#ef4444" />
    <circle cx="34" cy="18" r="4" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4" fill="#10b981" />
    
    <!-- Cart Content -->
    <rect x="24" y="56" width="252" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="36" y="68" width="46" height="46" rx="6" fill="#3b82f6" opacity="0.3" />
    <text x="94" y="86" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Sony WH-1000XM5</text>
    <text x="94" y="104" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">₹4,999</text>
    
    <!-- Failure Intercept Banner -->
    <rect x="24" y="140" width="252" height="50" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="1" />
    <text x="36" y="162" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Payment Dropoff Intercepted</text>
    <text x="36" y="178" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="10">RecoverAI Trigger: 1-Click WhatsApp Rescue</text>

    <!-- Recovery CTA Pill -->
    <rect x="24" y="206" width="252" height="44" rx="8" fill="#4f46e5" />
    <text x="150" y="233" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rescue Cart via Autonomous Link →</text>
  </g>
