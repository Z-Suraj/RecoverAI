<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="30%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lineGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lineGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="meshCenter" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="80%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#475569" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Base -->
  <rect width="1920" height="1080" fill="url(#heroDarkBg)" />

  <!-- Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#meshCenter)" />
  <rect width="1920" height="1080" fill="url(#cyanOrb)" />

  <!-- Dot Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#dotGrid)" />

  <!-- Isometric Network / Fintech Transaction Constellations -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <!-- Curved flow channels -->
    <path d="M 0 350 C 400 320, 700 500, 1100 420 C 1500 340, 1700 480, 1920 400" fill="none" stroke="url(#lineGlow1)" stroke-width="3" />
    <path d="M 0 650 C 350 600, 800 750, 1200 620 C 1600 500, 1750 680, 1920 620" fill="none" stroke="url(#lineGlow2)" stroke-width="2.5" />
    <path d="M 300 0 C 450 300, 400 700, 600 1080" fill="none" stroke="#4f46e5" stroke-opacity="0.2" stroke-dasharray="8 6" />
    <path d="M 1400 0 C 1350 400, 1500 800, 1600 1080" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-dasharray="6 6" />
  </g>

  <!-- Telemetry Nodes and Status Beacons (Background Graphic) -->
  <g transform="translate(1000, 180)" opacity="0.85">
    <!-- Big Telemetry Hexagon Node -->
    <polygon points="200,60 280,105 280,195 200,240 120,195 120,105" fill="#0f172a" stroke="#6366f1" stroke-width="2" fill-opacity="0.8" />
    <circle cx="200" cy="150" r="28" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" />
    <path d="M 190 150 L 197 157 L 212 142" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="200" y="270" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">AUTONOMOUS ENGINE 99.8%</text>

    <!-- Connected sub-nodes -->
    <line x1="120" y1="150" x2="20" y2="150" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="20" cy="150" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="20" y="154" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">UPI</text>

    <line x1="280" y1="150" x2="380" y2="150" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="380" cy="150" r="16" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="380" y="154" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">PSP</text>

    <line x1="200" y1="60" x2="200" y2="-10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="200" cy="-10" r="16" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
    <text x="200" y="-6" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AI</text>
  </g>

  <!-- Ambient Light Vignette & Scanlines -->
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#312e81" stroke-width="2" />
  <line x1="0" y1="1080" x2="1920" y2="1080" stroke="#0f172a" stroke-width="4" />
</svg>
