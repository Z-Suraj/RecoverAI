<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="250" r="280" fill="#4f46e5" opacity="0.15" filter="url(#glow)" />
  <circle cx="250" cy="600" r="220" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Grid mesh background -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="700" x2="1200" y2="700" />
    <line x1="150" y1="0" x2="150" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="450" y1="0" x2="450" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="750" y1="0" x2="750" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    <line x1="1050" y1="0" x2="1050" y2="800" />
  </g>

  <!-- Central Modern Fintech Dashboard Mockup -->
  <g transform="translate(180, 120)">
    <!-- Main Window Frame -->
    <rect width="840" height="560" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Window Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 824 0 Q 840 0 840 16 L 840 48 L 0 48 Z" fill="#0f172a" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8" />

    <text x="420" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      RecoverAI Mission Control — Live Telemetry &amp; Gateway Recovery
    </text>

    <!-- Top KPI Row -->
    <g transform="translate(32, 70)">
      <!-- KPI 1 -->
      <rect width="236" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Revenue at Risk</text>
      <text x="16" y="64" fill="#f43f5e" font-family="'JetBrains Mono', monospace, sans-serif" font-size="24" font-weight="900">₹2,48,500</text>
      <text x="16" y="84" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">184 active leakage cases</text>

      <!-- KPI 2 -->
      <rect x="256" width="236" height="96" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="272" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Recovered Revenue</text>
      <text x="272" y="64" fill="#10b981" font-family="'JetBrains Mono', monospace, sans-serif" font-size="24" font-weight="900">₹96,400</text>
      <text x="272" y="84" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">+23.4% recovery velocity</text>

      <!-- KPI 3 -->
      <rect x="512" width="260" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="528" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Recovery Success Rate</text>
      <text x="528" y="64" fill="#818cf8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="24" font-weight="900">55.3%</text>
      <text x="528" y="84" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Automated 1-click fallback</text>
    </g>

    <!-- Main Chart Area -->
    <g transform="translate(32, 190)">
      <rect width="500" height="330" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Real-time Recovery Performance</text>
      <text x="20" y="50" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Intercepted dropoffs vs. autonomously settled transactions</text>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="120" x2="480" y2="120" stroke="#334155" stroke-dasharray="4 4" />
      <line x1="20" y1="180" x2="480" y2="180" stroke="#334155" stroke-dasharray="4 4" />
      <line x1="20" y1="240" x2="480" y2="240" stroke="#334155" stroke-dasharray="4 4" />
      <line x1="20" y1="300" x2="480" y2="300" stroke="#475569" />

      <!-- Area fill -->
      <path d="M 40 280 L 100 240 L 160 250 L 220 180 L 280 200 L 340 130 L 400 110 L 460 90 L 460 300 L 40 300 Z" fill="url(#chartGrad)" />
      <!-- Green recovered line -->
      <path d="M 40 280 L 100 240 L 160 250 L 220 180 L 280 200 L 340 130 L 400 110 L 460 90" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
      <!-- Red risk line -->
      <path d="M 40 190 L 100 170 L 160 210 L 220 140 L 280 160 L 340 120 L 400 150 L 460 110" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" />

      <!-- Dots on peak -->
      <circle cx="460" cy="90" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <circle cx="400" cy="110" r="4" fill="#10b981" />
    </g>

    <!-- Side Operational Live Stream -->
    <g transform="translate(548, 190)">
      <rect width="260" height="330" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Live Recovery Stream</text>
      
      <!-- Event 1 -->
      <rect x="12" y="52" width="236" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="72" r="6" fill="#10b981" />
      <text x="42" y="72" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">₹4,999 Recovered</text>
      <text x="42" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">UPI 1-Click Retry • Aarav S.</text>

      <!-- Event 2 -->
      <rect x="12" y="114" width="236" height="54" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="134" r="6" fill="#6366f1" />
      <text x="42" y="134" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">₹8,499 Diagnosed</text>
      <text x="42" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">PSP Latency 504 • High CLV</text>

      <!-- Event 3 -->
      <rect x="12" y="176" width="236" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="196" r="6" fill="#10b981" />
      <text x="42" y="196" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">₹14,500 Rescued</text>
      <text x="42" y="212" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">WhatsApp Nudge • Priya K.</text>

      <!-- Event 4 -->
      <rect x="12" y="238" width="236" height="54" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="258" r="6" fill="#f59e0b" />
      <text x="42" y="258" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Smart Gateway Routing</text>
      <text x="42" y="274" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5">Razorpay to Stripe Failover</text>
    </g>
  </g>
</svg>
