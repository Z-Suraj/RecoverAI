    <text x="40" y="262" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Autonomous SLA: 99.98%</text>
    <text x="40" y="280" fill="#cbd5e1" font-family="monospace" font-size="11">Zero Human Interventions Required</text>
