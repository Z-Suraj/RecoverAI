      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bizBg)" />
  <circle cx="400" cy="300" r="180" fill="#4f46e5" opacity="0.15" />

  <!-- FinOps Team & Merchant Operator Graphic -->
