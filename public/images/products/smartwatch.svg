  </defs>
  <rect width="200" height="200" rx="20" fill="url(#watchBg)" />
  <circle cx="100" cy="100" r="85" fill="#06b6d4" opacity="0.1" />
  <!-- Watch Straps -->
  <rect x="74" y="16" width="52" height="46" rx="8" fill="#334155" />
  <rect x="74" y="138" width="52" height="46" rx="8" fill="#334155" />
