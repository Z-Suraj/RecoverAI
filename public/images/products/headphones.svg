<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#hpGrad)" />
  <circle cx="100" cy="100" r="85" fill="#4f46e5" opacity="0.1" />
  <!-- Headband Arc -->
  <path d="M 50 110 C 50 50, 150 50, 150 110" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
  <path d="M 58 105 C 58 60, 142 60, 142 105" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <!-- Left Ear Cup -->
  <g transform="translate(36, 95)">
    <rect width="26" height="52" rx="13" fill="url(#cushionGrad)" stroke="#475569" stroke-width="2" />
    <circle cx="13" cy="26" r="6" fill="#6366f1" />
  </g>
  <!-- Right Ear Cup -->
  <g transform="translate(138, 95)">
    <rect width="26" height="52" rx="13" fill="url(#cushionGrad)" stroke="#475569" stroke-width="2" />
    <circle cx="13" cy="26" r="6" fill="#6366f1" />
  </g>
  <!-- Noise Cancelling LED Indicator -->
  <circle cx="49" cy="138" r="2.5" fill="#10b981" />
</svg>
