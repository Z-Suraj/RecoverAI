  </defs>
  <rect width="200" height="200" rx="20" fill="url(#coffeeBg)" />
  <!-- Machine Chassis -->
  <rect x="52" y="38" width="96" height="124" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
